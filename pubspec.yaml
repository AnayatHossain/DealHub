name: deal_hub
description: "A social shopping platform with group-buying discounts."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get: ^4.7.2
  velocity_x: ^4.3.1
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.2
  cloud_firestore: ^5.6.6
  firebase_storage: ^12.4.5
  image_picker: ^1.1.2
  shared_preferences: ^2.5.3
  mailer: ^6.4.1
  intl: ^0.20.2


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icons/dealhub_logo.png

  windows:
    generate: true
    image_path: assets/icons/dealhub_logo_1.png

  macos:
    generate: true
    image_path: assets/icons/dealhub_logo.png

  linux:
    generate: true
    image_path: assets/icons/dealhub_logo.png

  web:
    generate: true
    image_path: assets/icons/dealhub_logo.png




  flutter_lints: ^5.0.0

flutter:

  uses-material-design: true


  assets:
    - assets/icons/
    - assets/images/





